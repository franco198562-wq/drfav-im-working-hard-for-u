<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aegis Builder — Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<main class="auth-card">
<div class="brand-mark">A</div>
<h1>Aegis Builder</h1>
<p class="muted">Sign in to manage your Aegis website.</p>
<form id="loginForm">
<label for="code">Access code</label>
<input id="code" type="password" placeholder="Enter access code" autocomplete="current-password" required>
<button class="primary" type="submit">Sign in</button>
<p id="loginMessage" class="message" aria-live="polite"></p>
</form>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit', function(event) {
  event.preventDefault();
  const code = document.getElementById('code').value;
  if (code === 'berzelia') {
    sessionStorage.setItem('aegisAuthenticated', 'true');
    location.href = 'builder.html';
  } else {
    document.getElementById('loginMessage').textContent = 'Incorrect access code.';
  }
});
</script>
</body>
</html>
